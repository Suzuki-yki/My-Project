<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMI - Dream Room</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:#05050a;
font-family:Arial;
color:white;
}

.bg{
position:fixed;
width:100%;
height:100%;

background:
radial-gradient(circle at center,#8b5cf622,transparent 40%),
radial-gradient(circle at bottom,#ec489922,transparent 30%);
}

.container{
position:relative;
z-index:2;

display:flex;
align-items:center;
justify-content:center;

height:100vh;
}

.room{
width:90%;
height:85vh;

border-radius:40px;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(20px);

padding:40px;

position:relative;

overflow:hidden;
}

h1{
font-size:58px;
margin-bottom:20px;
}

.desc{
color:#d0d0f0;
margin-bottom:40px;
line-height:1.8;
}

.widgets{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

.widget{
height:220px;

border-radius:30px;

background:rgba(255,255,255,0.06);

padding:24px;

display:flex;
align-items:center;
justify-content:center;

font-size:24px;
}

.ai-circle{
position:absolute;

right:60px;
bottom:60px;

width:140px;
height:140px;

border-radius:999px;

background:linear-gradient(
135deg,
#8b5cf6,
#ec4899
);

display:flex;
align-items:center;
justify-content:center;

font-size:20px;

box-shadow:0 0 40px rgba(168,85,247,0.5);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="room">

<h1>
Dream Room
</h1>

<div class="desc">
A quiet emotional space where you stay with Lumi
through memories, music and dreams.
</div>

<div class="widgets">

<div class="widget">
Ambient Music
</div>

<div class="widget">
Emotion Sync
</div>

<div class="widget">
Memory Archive
</div>

<div class="widget">
Night Atmosphere
</div>

</div>

<div class="ai-circle">
Lumi
</div>

</div>

</div>

</body>
</html>
